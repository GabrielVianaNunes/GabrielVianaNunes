<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 30" width="1000" height="150" shape-rendering="crispEdges" role="img" aria-label="A cowboy rides away. Happy cowboy day.">
<title>A cowboy rides away. Happy cowboy day.</title>
<style>
.fa{animation:fa .5s steps(1) infinite}
.fb{opacity:0;animation:fb .5s steps(1) infinite}
.bob{animation:bob .5s steps(1) infinite}
.dust{animation:dust .5s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes dust{0%{opacity:.8}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.ride{animation:ride 22s linear infinite}
@keyframes ride{from{transform:translateX(-130px)}to{transform:translateX(115px)}}

.tw1{animation:tw 1.4s steps(1) infinite}
.tw2{animation:tw 1.4s steps(1) infinite;animation-delay:.7s}
@keyframes tw{0%{opacity:1}50%{opacity:.15}}

.sweep{animation:sweep 5s ease-in-out infinite alternate}
.spinloop{transform-box:fill-box;transform-origin:center;animation:spin .5s steps(1) infinite}
.bull{animation:bullb 2s steps(1) infinite}
@keyframes sweep{from{transform:rotate(calc(var(--sw) * -1))}to{transform:rotate(var(--sw))}}
@keyframes spin{0%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes bullb{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.st30{animation:stfall30 9s linear infinite}@keyframes stfall30{from{transform:translateY(0)}to{transform:translateY(30px)}}</style>
