<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 30" width="1000" height="150" shape-rendering="crispEdges" role="img" aria-label="A cowboy rides away. Spooky trails.">
<title>A cowboy rides away. Spooky trails.</title>
<style>
.fa{animation:fa .5s steps(1) infinite}
.fb{opacity:0;animation:fb .5s steps(1) infinite}
.bob{animation:bob .5s steps(1) infinite}
.dust{animation:dust .5s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
