.ride{animation:ride 22s linear infinite}
@keyframes ride{from{transform:translateX(-130px)}to{transform:translateX(115px)}}

.tw1{animation:tw 1.4s steps(1) infinite}
.tw2{animation:tw 1.4s steps(1) infinite;animation-delay:.7s}
@keyframes tw{0%{opacity:1}50%{opacity:.15}}

.blink{animation:blink 1s steps(1) infinite}
.steam{animation:steam 1.6s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes steam{0%{transform:translateY(0);opacity:.9}50%{transform:translateY(-1px);opacity:.5}}
.dr30{animation:drfall30 9s linear infinite}@keyframes drfall30{from{transform:translateY(0)}to{transform:translateY(30px)}}</style>
