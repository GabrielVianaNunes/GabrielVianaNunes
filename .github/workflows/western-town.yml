name: Western town

# Rebuilds the western town from my contribution calendar and publishes the two SVG files
# (day and night) to the output branch. Every step must succeed before anything is published,
# so a failure leaves the previous good files in place.
on:
  schedule:
    - cron: "30 18 * * *"   # daily at 18:30 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to publish to. Use output-preview to test without touching the live files."
        type: choice
        default: output
        options:
          - output
          - output-preview

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'output' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Fetch the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py --user "$USERNAME" --out "$RUNNER_TEMP/contributions.json"

      - name: Build the town
        run: python scripts/build_town.py --input "$RUNNER_TEMP/contributions.json" --out "$RUNNER_TEMP/town"

      - name: Publish to the target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET"; then
            git checkout -q -f -B "$TARGET" "origin/$TARGET"
          else
            git checkout -q -f --orphan "$TARGET"
            git rm -rfq . || true
          fi
          cp "$RUNNER_TEMP/town/western-town-day.svg" western-town-day.svg
          cp "$RUNNER_TEMP/town/western-town-night.svg" western-town-night.svg
          git add western-town-day.svg western-town-night.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update western town"
          git push origin "$TARGET"
