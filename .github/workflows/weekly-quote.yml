name: Weekly quote

on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build the quote of the week
        run: |
          python scripts/update_quote.py
          mkdir -p "$RUNNER_TEMP/out"
          cp assets/quote.svg "$RUNNER_TEMP/out/quote.svg"
      - name: Publish to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -q -B output origin/output
          else
            git checkout -q --orphan output
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/out/quote.svg" quote.svg
          git add quote.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: quote of the week"
          git push origin output
