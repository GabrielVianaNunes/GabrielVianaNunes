name: Profile 3D contributions

on:
  schedule:
    - cron: "0 18 * * *"   # daily at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Publish to the output branch
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -r profile-3d-contrib "$RUNNER_TEMP/out/profile-3d-contrib"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -q -f -B output origin/output
          else
            git checkout -q -f --orphan output
            git rm -rfq . || true
          fi
          rm -rf profile-3d-contrib
          cp -r "$RUNNER_TEMP/out/profile-3d-contrib" profile-3d-contrib
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: update 3D contribution profile"
          git push origin output
